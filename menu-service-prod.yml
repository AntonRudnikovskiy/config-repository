spring:
  datasource:
    # Используем переменные окружения для указания логинов, паролей и урлов
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  jpa:
    show_sql: false # Выключаем показ sql запросов
  flyway:
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${FLYWAY_DB_URL}